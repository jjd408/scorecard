# Builds installers when a version tag is pushed (e.g. git tag v1.0.0 && git push origin v1.0.0) and attaches
# them to a GitHub release: an .msi for Windows, a .dmg for macOS and a .deb for Linux, each built on its own
# system by scripts/package.sh. Each installer is installed and started on its system first (the smoke test);
# the release stays a draft until every installer has passed and been uploaded.
# "Run workflow" on the Actions tab builds and tests the installers without making a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version number for the test installers
        default: 1.0.0

permissions:
  contents: write

env:
  # The tag without its "v", or the version typed in for a manual run.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  draft:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Scorecard ${VERSION#v}" --notes-file packaging/release-notes.md

  installers:
    needs: draft
    # Also runs when there is no release to draft (a manual run).
    if: always() && needs.draft.result != 'failure' && needs.draft.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: mvn -B package -Djava.awt.headless=true
      - name: Build (Windows and macOS; tested on Linux)
        if: runner.os != 'Linux'
        run: mvn -B package -DskipTests
      - name: Install WiX 3 (Windows; jpackage needs it for .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Build the installer
        run: scripts/package.sh "${VERSION#v}"
      - name: Install and start it (Linux and macOS)
        if: runner.os != 'Windows'
        run: scripts/smoke-test.sh
      - name: Install and start it (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-test.ps1
      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-${{ runner.os }}
          path: target/smoke
          if-no-files-found: ignore
      - name: Attach the installer to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/installers/* --clobber

  publish:
    needs: installers
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
