# Builds installers when a version tag is pushed (e.g. git tag v1.0.0 && git push origin v1.0.0) and attaches
# them to a GitHub release: an .msi for Windows, a .dmg for macOS and a .deb for Linux, each built on its own
# system by scripts/package.sh. The release stays a draft until every installer is uploaded.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Scorecard ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md

  installers:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: mvn -B package -Djava.awt.headless=true
      - name: Build (Windows and macOS; tested on Linux)
        if: runner.os != 'Linux'
        run: mvn -B package -DskipTests
      - name: Install WiX 3 (Windows; jpackage needs it for .msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
            $wix = Get-ChildItem "C:\Program Files (x86)" -Filter "WiX Toolset v3*" -Directory | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Build the installer
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/installers/* --clobber

  publish:
    needs: installers
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
